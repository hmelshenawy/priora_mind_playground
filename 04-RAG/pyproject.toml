[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "priora-rag"
version = "0.1.0"
description = "Priora Mind Coaching RAG MVP service"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "qdrant-client>=1.9,<2",
  "sentence-transformers>=3.0,<4",
  "python-dotenv>=1.0,<2",
  "pymupdf>=1.28,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9",
  "httpx>=0.27,<1",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"